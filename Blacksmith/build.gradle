apply plugin: 'com.android.application'

// Signing credentials live in ~/.gradle/gradle.properties, outside this repo so they can never be
// committed. Without them the build still works: debug falls back to the local debug keystore and
// release comes out unsigned, which is what anyone cloning this public repo will get.
def signingReady = ['PB_STORE_FILE', 'PB_STORE_PASSWORD', 'PB_KEY_ALIAS', 'PB_KEY_PASSWORD'].every {
    project.hasProperty(it)
} && file(project.findProperty('PB_STORE_FILE').toString()).exists()

android {
    namespace = "uk.co.jakelee.blacksmith"
    compileSdkVersion 36

    defaultConfig {
        applicationId "uk.co.jakelee.blacksmith"
        minSdkVersion 23
        targetSdkVersion apiVersion
        versionCode 89
        versionName "3.0.3"
        multiDexEnabled true
    }
    if (signingReady) {
        signingConfigs {
            shipping {
                storeFile = file(project.findProperty('PB_STORE_FILE').toString())
                storePassword = project.findProperty('PB_STORE_PASSWORD').toString()
                keyAlias = project.findProperty('PB_KEY_ALIAS').toString()
                keyPassword = project.findProperty('PB_KEY_PASSWORD').toString()
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard.pro'
            if (signingReady) signingConfig = signingConfigs.shipping
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard.pro'
            // Signed with the shipping certificate so Play Games authenticates locally; it matches
            // on package name plus certificate, and a debug-signed build fails with DEVELOPER_ERROR.
            if (signingReady) signingConfig = signingConfigs.shipping
        }
    }
    buildFeatures {
        buildConfig true
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation "com.android.support:appcompat-v7:$supportLibraryVersion"
    implementation "com.android.support:design:$supportLibraryVersion"
    implementation "com.android.support:percent:$supportLibraryVersion"
    implementation "com.google.android.gms:play-services-games-v2:$gamesLibraryVersion"
    implementation 'com.github.satyan:sugar:1.5'
    implementation 'com.google.code.gson:gson:2.7'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'com.scottyab:aescrypt:0.0.1'
    implementation('com.github.worker8:TourGuide:v1.0.17-SNAPSHOT@aar') { // Via JitPack; jcenter's copy is gone
        transitive = true
    }
    implementation 'com.github.hotchemi:android-rate:1.0.1'
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.1.16'
    implementation 'com.squareup.picasso:picasso:2.5.2'
    implementation 'com.github.jinatonic.confetti:confetti:1.1.1'

    constraints {
        // Play Billing 9 drags in lifecycle 2.6.2 -> coroutines -> kotlin-stdlib-jdk8:1.6.21, and
        // those jdk7/jdk8 classes moved into kotlin-stdlib proper in Kotlin 1.8, so the two clash.
        // Aligning the versions turns the jdk7/jdk8 artifacts back into empty shims.
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
