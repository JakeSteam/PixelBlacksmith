// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
    }
}

ext {
    apiVersion = 36
    compilerVersion = '25.0.1'
    supportLibraryVersion = '23.0.0' // Updating this breaks alert sizes, tutorial skipping, and many other things. Don't.
    gamesLibraryVersion = '21.0.0' // v2; do not use 22.x, it needs minSdk 24
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url = "https://jitpack.io" } // Serves TourGuide, which died with jcenter
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
